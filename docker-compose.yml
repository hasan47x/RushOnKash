version: '3.8'

services:
  # PostgreSQL Database (local Supabase alternative)
  postgres:
    image: postgres:15-alpine
    container_name: rushoncash-postgres
    environment:
      POSTGRES_DB: rushoncash
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Supabase Studio (optional)
  supabase-studio:
    image: supabase/studio:latest
    container_name: rushoncash-studio
    ports:
      - "54323:54323"
    environment:
      SUPABASE_URL: http://postgres:5432
      SUPABASE_KEY: your-anon-key
    depends_on:
      - postgres

  # Telegram Bot
  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: rushoncash-bot
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - BOT_TOKEN=${BOT_TOKEN}
      - WEBHOOK_URL=http://localhost:3000
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - SUPABASE_URL=http://postgres:5432
      - SUPABASE_ANON_KEY=your-anon-key
      - SUPABASE_SERVICE_KEY=your-service-key
      - MINI_APP_URL=http://localhost:3001
      - ADMIN_PANEL_URL=http://localhost:3002
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./bot/src:/app/src
    command: npm run dev

  # Mini App
  mini-app:
    build:
      context: ./mini-app
      dockerfile: Dockerfile
    container_name: rushoncash-mini-app
    ports:
      - "3001:80"
    environment:
      - VITE_SUPABASE_URL=http://postgres:5432
      - VITE_SUPABASE_ANON_KEY=your-anon-key
    depends_on:
      - postgres
    volumes:
      - ./mini-app/src:/app/src
      - ./mini-app/public:/app/public
    command: npm run dev -- --host 0.0.0.0 --port 80

  # Admin Panel
  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    container_name: rushoncash-admin
    ports:
      - "3002:80"
    environment:
      - VITE_SUPABASE_URL=http://postgres:5432
      - VITE_SUPABASE_ANON_KEY=your-anon-key
    depends_on:
      - postgres
    volumes:
      - ./admin-panel/src:/app/src
      - ./admin-panel/public:/app/public
    command: npm run dev -- --host 0.0.0.0 --port 80

  # Redis (for rate limiting, sessions)
  redis:
    image: redis:7-alpine
    container_name: rushoncash-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: rushoncash-network